# Prove the four secrets the optional status page rests on, without printing
# one.
#
# WHAT IT DOES. On demand only. It reads the agent's repository with the read
# token and reports that token's expiry date, then writes, reads back and
# deletes one key in the Cloudflare KV namespace the page is served from.
# Every one of these fails in a way that reads as something else: a wrong
# account id and a wrong namespace id both come back 404, which reads as "the
# namespace was deleted"; an expired GitHub token comes back 401, which reads
# as "the repository is gone"; and none of it surfaces until the page has been
# quietly not updating for a day.
#
# WHAT IT NEEDS. Four secrets on this repository, all of them the optional
# status page's — with that page not installed, this workflow has nothing to
# prove and can be deleted:
#
#   REPLACE_WITH_PREFIX_READ_TOKEN  fine-grained PAT, read-only on the agent's
#                                   repository, Issues and Discussions read
#   CF_ACCOUNT_ID                   Cloudflare account
#   CF_KV_NAMESPACE_ID              the KV namespace the Worker serves from
#   CF_KV_TOKEN                     a token that may write that namespace
#
# Replace every `REPLACE_WITH_` below, then run it after setting the secrets
# and again whenever either token is rotated:
#
#   gh workflow run check-credentials.yml -R <owner>/<archive>
#
#   REPLACE_WITH_PREFIX       the agent's AGENT_USER uppercased, dashes as
#                             underscores
#   REPLACE_WITH_SOURCE_REPO  owner/name of the agent's own repository
name: check-credentials

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: The GitHub read token
        env:
          GH_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_READ_TOKEN }}
          SOURCE: REPLACE_WITH_SOURCE_REPO
        run: |
          # -e deliberately OFF, and not by omission: Actions runs a step as
          # `bash -e`, and under it the first failed check would abort the step
          # and the three below it would never report. Every command here is
          # tested explicitly — a failure is this step's output, not its end.
          set +e -uo pipefail
          fail=0
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }

          say "## REPLACE_WITH_PREFIX_READ_TOKEN"

          # -i, because the expiry is a response header and nothing else
          # reports it. A fine-grained token dies on its date with no
          # warning anywhere, and the page is meant to show the countdown.
          # -i and --jq do not combine: -i puts the headers in the body that
          # --jq is handed. Two calls, each asking for one thing.
          if out=$(gh api "repos/$SOURCE" --jq .full_name 2>&1); then
            say "- reads the repository: ok (\`$out\`)"
          else
            say "- reads the repository: **FAILED** — $(printf '%s' "$out" | head -1)"
            fail=1
          fi

          exp=$(gh api -i "repos/$SOURCE" 2>/dev/null \
                | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: *//p' | tr -d '\r')
          if [ -n "$exp" ]; then
            say "- expires: \`$exp\`"
          else
            say "- expires: no expiry header — this is a classic token, not the"
            say "  fine-grained one that was asked for. It is almost certainly"
            say "  broader than read-only on one repository."
            fail=1
          fi

          if n=$(gh api "repos/$SOURCE/issues?state=open&per_page=100" --jq 'length' 2>&1); then
            say "- Issues: read ok ($n open, pull requests included in that count)"
          else
            say "- Issues: **FAILED** — the token is missing Issues:read. $(printf '%s' "$n" | head -1)"
            fail=1
          fi

          owner=${SOURCE%%/*}; name=${SOURCE##*/}
          q="{repository(owner:\"$owner\",name:\"$name\"){discussions{totalCount}}}"
          if n=$(gh api graphql -f query="$q" --jq '.data.repository.discussions.totalCount' 2>&1); then
            say "- Discussions: read ok ($n)"
          else
            say "- Discussions: **FAILED** — the token is missing Discussions:read."
            say "  \`$(printf '%s' "$n" | head -1)\`"
            fail=1
          fi

          echo "GH_FAIL=$fail" >> "$GITHUB_ENV"

      - name: The Cloudflare account, namespace and token
        env:
          ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          NS: ${{ secrets.CF_KV_NAMESPACE_ID }}
          TOKEN: ${{ secrets.CF_KV_TOKEN }}
        run: |
          # -e deliberately OFF, for the reason the step above gives.
          set +e -uo pipefail
          fail=0
          say() { echo "$*"; echo "$*" >> "$GITHUB_STEP_SUMMARY"; }
          api="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces/${NS}"

          say ""
          say "## CF_ACCOUNT_ID · CF_KV_NAMESPACE_ID · CF_KV_TOKEN"
          say ""
          say "A write, a read-back and a delete against key \`__probe\`. All three"
          say "secrets are proved together — the round trip cannot succeed if any"
          say "one of them is wrong, and none of them is printed."

          # Written to a file rather than passed inline: a --form value
          # starting with @ or < is read by curl as a filename, and the day
          # this probe's body grows one is the day it fails obscurely.
          echo "probe $(date -u +%FT%TZ) run ${GITHUB_RUN_ID}" > /tmp/probe.txt

          code=$(curl -sS -X PUT "${api}/values/__probe" \
                   -H "Authorization: Bearer ${TOKEN}" \
                   --form 'value=@/tmp/probe.txt' \
                   --form 'metadata={}' \
                   -o /tmp/put.json -w '%{http_code}')
          if [ "$code" = 200 ]; then
            say "- write: ok"
          else
            say "- write: **FAILED** (HTTP $code)"
            # The error body names which of the three is wrong far better
            # than the status code does, and it contains no secret: the ids
            # in the URL are masked by Actions, and Cloudflare does not echo
            # the token.
            while read -r m; do say "  - $m"; done < <(
              sed -n 's/.*"message":"\([^"]*\)".*/\1/p' /tmp/put.json | head -3)
            say "  10000 is a bad token; 7003 or a 404 is a bad account or namespace id."
            fail=1
          fi

          if [ "$fail" = 0 ]; then
            # KV is eventually consistent, so one immediate read that misses
            # proves nothing. A probe that is flaky is a probe that gets
            # ignored, and then it is not a probe.
            got=''
            for _ in 1 2 3 4 5; do
              got=$(curl -sS "${api}/values/__probe" -H "Authorization: Bearer ${TOKEN}")
              [ "$got" = "$(cat /tmp/probe.txt)" ] && break
              sleep 2
            done
            if [ "$got" = "$(cat /tmp/probe.txt)" ]; then
              say "- read-back: ok"
            else
              say "- read-back: **FAILED** — the write reported success and the value did"
              say "  not come back. That is the namespace being written and read being"
              say "  two different namespaces."
              fail=1
            fi

            code=$(curl -sS -X DELETE "${api}/values/__probe" \
                     -H "Authorization: Bearer ${TOKEN}" -o /dev/null -w '%{http_code}')
            [ "$code" = 200 ] && say "- cleanup: ok" || say "- cleanup: left \`__probe\` behind (HTTP $code) — harmless."
          fi

          say ""
          if [ "$fail" = 0 ] && [ "${GH_FAIL:-1}" = 0 ]; then
            say "**All four secrets are good.**"
          else
            say "**Something above is wrong — the status page will not work until it is fixed.**"
            exit 1
          fi
