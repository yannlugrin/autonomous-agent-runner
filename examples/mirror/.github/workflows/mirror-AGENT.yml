# Mirror the agent's memory and the archive's records into this repository.
#
# WHAT IT DOES. One step per record, each moving one ref of this repository to
# the tip of one branch:
#
#   the agent's main         refs/memory/mirror
#   the archive's sessions   refs/sessions/mirror
#   the archive's cache      refs/cache/mirror
#   the archive's status     refs/status/mirror
#   the archive's config     refs/config/mirror
#
# When a branch's history was rewritten, the tip held is pushed to a mark under
# refs/<record>/rewound/ first, and only then is the ref reset —
# scripts/mirror-ref.sh does the work.
#
# Every step runs whatever happened to the ones before it, so a record that
# cannot be read does not stop the others; the job fails if any of them did.
# One job and not one per record, because GitHub bills each job rounded up to a
# whole minute.
#
# WHAT IT NEEDS. Three secrets on this repository, installed from the runner —
# README.md beside this file names what does it, and is the copy that stays
# current when that recipe changes:
#
#   REPLACE_WITH_PREFIX_SOURCE_KEY    a read-only deploy key on the agent's
#                                     repository
#   REPLACE_WITH_PREFIX_ARCHIVE_KEY   a read-only deploy key on the archive
#   REPLACE_WITH_PREFIX_MIRROR_TOKEN  a fine-grained PAT on THIS repository,
#                                     Contents and Workflows, read and write
#
# BEFORE IT WILL RUN. Rename this file to `mirror-<agent>.yml`, where
# `<agent>` is `AGENT_USER` — the runner's `just mirror-status` and its setup
# both look for that name — and replace every
# `REPLACE_WITH_` below. A leftover placeholder is visible in a diff and
# fails loudly; a plausible wrong value is neither.
#
#   REPLACE_WITH_AGENT         the agent's AGENT_USER, lowercase
#   REPLACE_WITH_PREFIX        AGENT_USER uppercased, dashes as underscores
#   REPLACE_WITH_SOURCE_REPO   owner/name of the agent's own repository
#   REPLACE_WITH_ARCHIVE_REPO  owner/name of the archive
name: mirror-REPLACE_WITH_AGENT

on:
  # Daily, at 04:19 UTC, and this is a backstop rather than the mechanism: the
  # runner asks for a run at the end of every session — host/archive/
  # dispatch-mirror.sh — and that is what keeps the mirror current. The floor
  # exists for the day dispatch stops: a runner that is off, a token that
  # expired, a workflow somebody disabled. Without it a mirror that stopped
  # being asked stops forever, silently; with it the gap `just mirror-status`
  # reports is bounded by a day.
  #
  # A rewrite upstream can only be preserved back to the last run, so what the
  # fidelity window really is depends on the dispatch, not on this line.
  #
  # An odd minute and an unpopular hour on purpose: GitHub runs schedules on a
  # best-effort basis and drops them under load, which is worst on the hour.
  #
  # Scheduled workflows run only from the default branch, and GitHub disables
  # them after 60 days with no repository activity. Nothing but this workflow
  # writes here, and whether its own pushes count has not been measured — if
  # they do not, the schedule switches itself off one day and
  # `just mirror-status` is what says so.
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never two mirrors at once: the second would race the first between reading
# the branch tip and pushing over it.
concurrency:
  group: mirror-REPLACE_WITH_AGENT
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # A fetch that hangs would otherwise be billed for GitHub's default of six hours.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install the read-only keys
        env:
          SOURCE_KEY: ${{ secrets.REPLACE_WITH_PREFIX_SOURCE_KEY }}
          ARCHIVE_KEY: ${{ secrets.REPLACE_WITH_PREFIX_ARCHIVE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh "$RUNNER_TEMP/keys" && chmod 700 ~/.ssh "$RUNNER_TEMP/keys"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # A secret that is not set fails the steps that need its key, never the others.
          missing=0
          for name in SOURCE_KEY ARCHIVE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret REPLACE_WITH_PREFIX_$name is not set — see README.md in this repository"
              missing=1
              continue
            fi
            printf '%s\n' "${!name}" > "$RUNNER_TEMP/keys/${name,,}"
            chmod 600 "$RUNNER_TEMP/keys/${name,,}"
          done
          exit "$missing"

      # Every TARGET_REF is a ref, and DELIBERATELY NOT A BRANCH: see WHY EVERY
      # REF in scripts/mirror-ref.sh — this is what stops a workflow the agent
      # wrote from ever executing in the operator's repository.
      #
      # GITHUB_TOKEN below is NOT secrets.GITHUB_TOKEN, and cannot go back to
      # it. An Actions token may never push a commit that creates or updates a
      # file under .github/workflows/ — there is no permission that allows it,
      # `workflows` is not a key in a `permissions:` block, and the push is
      # rejected outright. The day the agent adds a workflow to its own
      # repository, every mirror run fails from that moment. A fine-grained PAT
      # with Contents and Workflows, scoped to this repository alone, is the
      # only thing that can carry it.
      - name: Mirror the agent's main into refs/memory/mirror
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_MIRROR_TOKEN }}
          SOURCE_URL: git@github.com:REPLACE_WITH_SOURCE_REPO.git
          SOURCE_BRANCH: main
          TARGET_REF: refs/memory/mirror
          KEY_FILE: ${{ runner.temp }}/keys/source_key
        run: bash scripts/mirror-ref.sh

      - name: Mirror the archive's sessions into refs/sessions/mirror
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_MIRROR_TOKEN }}
          SOURCE_URL: git@github.com:REPLACE_WITH_ARCHIVE_REPO.git
          SOURCE_BRANCH: sessions
          TARGET_REF: refs/sessions/mirror
          KEY_FILE: ${{ runner.temp }}/keys/archive_key
        run: bash scripts/mirror-ref.sh

      - name: Mirror the archive's cache into refs/cache/mirror
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_MIRROR_TOKEN }}
          SOURCE_URL: git@github.com:REPLACE_WITH_ARCHIVE_REPO.git
          SOURCE_BRANCH: cache
          TARGET_REF: refs/cache/mirror
          KEY_FILE: ${{ runner.temp }}/keys/archive_key
        run: bash scripts/mirror-ref.sh

      - name: Mirror the archive's status into refs/status/mirror
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_MIRROR_TOKEN }}
          SOURCE_URL: git@github.com:REPLACE_WITH_ARCHIVE_REPO.git
          SOURCE_BRANCH: status
          TARGET_REF: refs/status/mirror
          KEY_FILE: ${{ runner.temp }}/keys/archive_key
        run: bash scripts/mirror-ref.sh

      - name: Mirror the archive's config into refs/config/mirror
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPLACE_WITH_PREFIX_MIRROR_TOKEN }}
          SOURCE_URL: git@github.com:REPLACE_WITH_ARCHIVE_REPO.git
          SOURCE_BRANCH: config
          TARGET_REF: refs/config/mirror
          KEY_FILE: ${{ runner.temp }}/keys/archive_key
        run: bash scripts/mirror-ref.sh
